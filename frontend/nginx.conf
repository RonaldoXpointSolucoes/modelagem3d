map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Appwrite no mesmo domínio do app: evita CORS e cookies de terceiros (Safari/iOS).
  # O front usa VITE_APPWRITE_ENDPOINT=https://3d.xpointsolucoes.com.br/v1
  location /v1/ {
    proxy_pass https://appwrite-inwbueezn2gkpm4tqwvzkswy.179.199.142.157.sslip.io;
    proxy_ssl_server_name on;
    proxy_set_header Host appwrite-inwbueezn2gkpm4tqwvzkswy.179.199.142.157.sslip.io;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Realtime (WebSocket)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    client_max_body_size 50m;
  }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
